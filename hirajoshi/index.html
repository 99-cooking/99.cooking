<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harmonious Geometry: The Hirajoshi Wave</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0f; overflow: hidden; cursor: crosshair; }
canvas { display: block; }
#overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  background: rgba(10,10,15,0.92); z-index: 10;
  transition: opacity 0.8s; cursor: pointer;
}
#overlay.hidden { opacity: 0; pointer-events: none; }
#overlay-content { text-align: center; color: #e8e8f0; font-family: 'Georgia', serif; }
#overlay-content h1 { font-size: clamp(1.8rem, 4vw, 3.2rem); font-weight: 300; letter-spacing: 0.08em; margin-bottom: 0.5em; }
#overlay-content p { font-size: clamp(0.85rem, 1.5vw, 1.1rem); line-height: 1.7; max-width: 600px; margin: 0 auto 1.5em; opacity: 0.7; }
#overlay-content .start { font-size: 1rem; opacity: 0.5; letter-spacing: 0.15em; text-transform: uppercase; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 0.7; } }
#info {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.25); font-family: 'Georgia', serif;
  font-size: 0.75rem; letter-spacing: 0.1em; z-index: 5;
  transition: opacity 0.5s;
}
</style>
</head>
<body>
<div id="overlay">
  <div id="overlay-content">
    <h1>Harmonious Geometry</h1>
    <p>The Hirajoshi Wave</p>
    <p style="font-size: 0.85em; opacity: 0.5;">Five spheres tuned to the C Hirajoshi scale<br>C · D♭ · E♭ · G · A♭</p>
    <div class="start">click to begin</div>
  </div>
</div>
<canvas id="c"></canvas>
<div id="info">C Hirajoshi · Polyrhythmic Pendulum</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;
let audioCtx, started = false;
let time = 0;
let balls = [];
let trails = [];
const MAX_TRAIL = 120;

// C Hirajoshi scale frequencies (octave 4)
const NOTES = [
  { name: 'C',  freq: 261.63, periods: 15 },
  { name: 'D♭', freq: 277.18, periods: 17 },
  { name: 'E♭', freq: 311.13, periods: 19 },
  { name: 'G',  freq: 392.00, periods: 23 },
  { name: 'A♭', freq: 415.30, periods: 29 },
];

// Rainbow hues for each ball
const HUES = [0, 45, 140, 210, 290];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}
window.addEventListener('resize', resize);
resize();

class Ball {
  constructor(index) {
    this.index = index;
    this.note = NOTES[index];
    this.hue = HUES[index];
    this.periods = this.note.periods;
    this.radius = Math.min(W, H) * 0.015;
    this.trail = [];
    this.osc = null;
    this.gain = null;
    this.x = 0;
    this.y = 0;
  }

  update(t) {
    // Each ball oscillates with its own period count over a full cycle
    const amplitude = Math.min(W, H) * 0.35;
    const spread = (this.index - 2) * (W * 0.08);
    
    // Polyrhythmic: different angular velocities
    const omega = this.periods;
    const phase = omega * t;
    
    // Lissajous-like path
    this.x = cx + spread + Math.sin(phase * 1.1 + this.index * 0.7) * amplitude * 0.25;
    this.y = cy + Math.sin(phase) * amplitude * 0.45;
    
    // Trail
    this.trail.push({ x: this.x, y: this.y, t: time });
    if (this.trail.length > MAX_TRAIL) this.trail.shift();

    // Audio modulation
    if (this.gain) {
      const vol = 0.03 + 0.025 * Math.abs(Math.sin(phase));
      this.gain.gain.setTargetAtTime(vol, audioCtx.currentTime, 0.05);
    }
  }

  draw() {
    // Trail
    if (this.trail.length > 2) {
      for (let i = 1; i < this.trail.length; i++) {
        const alpha = (i / this.trail.length) * 0.6;
        const width = (i / this.trail.length) * 4;
        ctx.beginPath();
        ctx.moveTo(this.trail[i-1].x, this.trail[i-1].y);
        ctx.lineTo(this.trail[i].x, this.trail[i].y);
        ctx.strokeStyle = `hsla(${this.hue + i * 0.5}, 80%, 60%, ${alpha})`;
        ctx.lineWidth = width;
        ctx.stroke();
      }
    }

    // Glow
    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius * 4);
    gradient.addColorStop(0, `hsla(${this.hue}, 90%, 70%, 0.4)`);
    gradient.addColorStop(1, `hsla(${this.hue}, 90%, 70%, 0)`);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * 4, 0, Math.PI * 2);
    ctx.fillStyle = gradient;
    ctx.fill();

    // Ball
    const ballGrad = ctx.createRadialGradient(
      this.x - this.radius * 0.3, this.y - this.radius * 0.3, 0,
      this.x, this.y, this.radius
    );
    ballGrad.addColorStop(0, `hsla(${this.hue}, 85%, 85%, 1)`);
    ballGrad.addColorStop(0.7, `hsla(${this.hue}, 80%, 60%, 1)`);
    ballGrad.addColorStop(1, `hsla(${this.hue}, 70%, 40%, 1)`);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = ballGrad;
    ctx.fill();
  }

  initAudio() {
    this.osc = audioCtx.createOscillator();
    this.gain = audioCtx.createGain();
    
    // Soft sine wave
    this.osc.type = 'sine';
    this.osc.frequency.value = this.note.freq;
    this.gain.gain.value = 0.04;
    
    // Gentle filter
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 2000;
    filter.Q.value = 1;
    
    this.osc.connect(filter);
    filter.connect(this.gain);
    this.gain.connect(audioCtx.destination);
    this.osc.start();
  }
}

function init() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  balls = NOTES.map((_, i) => {
    const b = new Ball(i);
    b.initAudio();
    return b;
  });
}

function animate(ts) {
  requestAnimationFrame(animate);
  if (!started) return;

  time += 0.008;

  // Fade background for trail effect
  ctx.fillStyle = 'rgba(10, 10, 15, 0.08)';
  ctx.fillRect(0, 0, W, H);

  // Connection lines between nearby balls
  for (let i = 0; i < balls.length; i++) {
    for (let j = i + 1; j < balls.length; j++) {
      const dx = balls[i].x - balls[j].x;
      const dy = balls[i].y - balls[j].y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const maxDist = Math.min(W,H) * 0.4;
      if (dist < maxDist) {
        const alpha = (1 - dist/maxDist) * 0.15;
        ctx.beginPath();
        ctx.moveTo(balls[i].x, balls[i].y);
        ctx.lineTo(balls[j].x, balls[j].y);
        ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }

  balls.forEach(b => {
    b.update(time);
    b.draw();
  });
}

document.getElementById('overlay').addEventListener('click', () => {
  document.getElementById('overlay').classList.add('hidden');
  init();
  started = true;
});

requestAnimationFrame(animate);
</script>
</body>
</html>
